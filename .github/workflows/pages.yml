# The lesson's page, https://wmacevoy.github.io/strong-coffee: site/ as it stands, and the slides
# (slides/strong-coffee.md) rendered to HTML by Marp. Built on every push to main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render the slides
        run: |
          mkdir -p _site/slides
          cp -r site/. _site/
          npx --yes @marp-team/marp-cli@4.5.1 slides/strong-coffee.md --html -o _site/slides/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
